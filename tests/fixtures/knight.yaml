asset: knight
brief: A blocky knight; exercises rotated parts, follow, mirrors and an orbit-view reference.
parts:
  - {name: legs, shape: box, size: [0.5, 0.9, 0.3], material: iron, align: bottom}
  - {name: torso, shape: box, size: [0.7, 0.8, 0.4], material: metal, on: legs.top}
  - {name: head, shape: sphere, radius: 0.18, material: skin, on: torso.top, offset: [0, 0.02, 0]}
  - {name: helmet, shape: cone, radius: 0.2, height: 0.25, material: metal, on: head.top, offset: [0, -0.08, 0]}
  - name: arm_l
    shape: capsule
    radius: 0.08
    height: 0.75
    material: metal
    on: torso.top_left
    align: top_right
    rotate: [0, 0, -20]
    mirror: x
  - name: sword
    shape: box
    size: [0.06, 0.9, 0.02]
    material: metal
    on: arm_r.bottom
    align: top
    tags: [weapon]
  - name: shield
    shape: cylinder
    radius: 0.3
    height: 0.06
    sides: 6
    rotate: [90, 0, 0]
    material: cloth_blue
    on: arm_l.front
    follow: false
reference:
  - {image: refs/tower_front.png, view: {azimuth: 30, elevation: 15}, mask: auto}
