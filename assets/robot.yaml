    at: [0, 1.47, -0.15]
  - name: spine
    shape: cylinder
    radius: 0.035
    height: 0.34
    sides: 8
    material: iron
    at: [0, 1.06, -0.13]
    align: bottom
  - name: spine_light
    shape: box
    size: [0.03, 0.025, 0.02]
    material: glow_blue
    at: [0, 1.15, -0.17]
    repeat: {count: 2, step: [0, 0.11, 0]}
  # --- neck and head -------------------------------------------------------------------------------
  - name: neck
    shape: cylinder
    radius: 0.06
    height: 0.1
    sides: 8
    material: iron
    at: [0, 1.585, -0.01]
    align: bottom
  - name: neck_light
    shape: box
    size: [0.014, 0.03, 0.02]
    material: glow_blue
    at: [0, 1.628, 0.063]
  - name: head_core                  # dark behind the face mask: the recesses at the cheeks
    shape: ellipsoid
    size: [0.17, 0.22, 0.19]
    material: iron
    at: [0, 1.775, -0.012]
  - name: cranium
    shape: ellipsoid
    size: [0.17, 0.14, 0.2]
    material: metal
    at: [0, 1.83, 0]
  - name: face                       # hexagonal mask: narrow chin, wide brow
    shape: cone
    radius: 0.04
    top_radius: 0.074
    height: 0.16
    sides: 6
    material: metal
    at: [0, 1.665, 0.03]
    align: bottom
  - name: crest
    shape: box
    size: [0.03, 0.04, 0.17]
    round: 0.01
    material: iron
    at: [0, 1.875, 0]
  - name: forehead_light
    shape: box
    size: [0.014, 0.018, 0.02]
