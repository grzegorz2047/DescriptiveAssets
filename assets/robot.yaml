  - name: ear_l
    shape: cylinder
    radius: 0.04
    height: 0.036
    rotate: [0, 0, 90]
    material: iron
    at: [-0.082, 1.765, -0.01]
    mirror: x
  - name: ear_ring_l
    shape: torus
    radius: 0.025
    thickness: 0.006
    rotate: [0, 0, 90]
    material: glow_blue
    at: [-0.1, 1.765, -0.01]
    mirror: x
  # --- shoulders and arms (T-pose along X) ---------------------------------------------------------
  - name: deltoid_l
    shape: ellipsoid
    size: [0.2, 0.15, 0.2]
    material: metal
    at: [-0.265, 1.575, 0]
