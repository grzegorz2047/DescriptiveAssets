    shape: box
    size: [0.08, 0.06, 0.05]
    round: 0.015
    material: metal
    at: [0, 1.335, 0.085]
    repeat: {count: 3, step: [0, -0.078, 0]}
  - name: chest_core                 # the dark frame between and around the chest plates
