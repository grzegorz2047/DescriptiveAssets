    size: [0.11, 0.08, 0.05]
    round: 0.015
    rotate: [0, 0, -14]
    material: metal
    at: [-0.1, 1.375, 0.09]
    mirror: x
  - name: sternum_light
    shape: box
    size: [0.03, 0.02, 0.02]
    material: glow_blue
    at: [0, 1.55, 0.098]
  - name: solar_light
    shape: box
    size: [0.03, 0.012, 0.02]
