asset: robot
brief: >
  A silver humanoid robot in a T-pose, built from the designer's front concept
  (refs/robot_front.png). 1.9 m tall, arm span about 2.23 m. Brushed steel plates over a black
  mechanical frame, blue lights (no emission: a bright blue) at the eyes, ears, chest, shoulders,
  arms, hips, thighs, knees and feet and down the spine. The back has its own plate over a black spine
  with blue lights. Detailed low-poly: the plates follow the divisions `sightline structure` finds in
  the concept; no rivets or panel lines; the T-pose keeps it ready for rigging.
style: default
tags: [character]
reference: {image: refs/robot_front.png, view: front, height: 1.9}
# Left/right follow the axes: _l parts are on -X (the viewer's left in the front view), which is the
# robot's right side. Every _l part is mirrored to _r. Arms run along X at shoulder height ~1.53 m.
# Plate positions come from `sightline structure assets/refs/robot_front.png --height 1.9`.
