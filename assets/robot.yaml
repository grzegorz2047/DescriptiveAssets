    rotate: [0, 0, -30]
    material: metal
    at: [-0.075, 1.165, 0.095]
    mirror: x
  - name: codpiece                   # trapezoid shield: a 4-sided frustum, wide at the top
    shape: cone
    radius: 0.055
    top_radius: 0.1
    height: 0.15
    sides: 4
    material: metal
    at: [0, 0.98, 0.05]
    align: bottom
  - name: hip_disc_l                 # round hip joint turned 40 deg forward, blue ring on its face
    shape: cylinder
    radius: 0.05
    height: 0.04
    rotate: [90, -50, 0]
    material: iron
    at: [-0.19, 1.09, 0.03]
    mirror: x
