asset: robot
brief: >
  A silver humanoid robot in a T-pose, built from the designer's concept in four views
  (refs/robot_front.png, robot_back.png, robot_right.png, robot_left.png). 1.9 m tall, arm span
  about 2.23 m. Brushed steel plates over a black mechanical frame, blue lights (no emission: a bright
  blue) at the eyes, ears, chest, shoulders, arms, hips, thighs, knees and feet. The back has its own
  plates (upper back, shoulder blades, lower back, spine segments) over the black frame, with a blue
  light on each shoulder blade; the side views give the depth of every part. Detailed low-poly: the plates follow the divisions `sightline structure` finds in
  the concept; no rivets or panel lines; the T-pose keeps it ready for rigging.
style: default
tags: [character]
reference:
  - {image: refs/robot_front.png, view: front, height: 1.9}
  - {image: refs/robot_back.png, view: back, height: 1.9}
  - {image: refs/robot_right.png, view: right, height: 1.9}
  - {image: refs/robot_left.png, view: left, height: 1.9}
# Left/right follow the axes: _l parts are on -X (the viewer's left in the front view), which is the
# robot's right side. Every _l part is mirrored to _r. Arms run along X at shoulder height ~1.53 m.
# Plate positions come from `sightline structure assets/refs/robot_front.png --height 1.9`.
