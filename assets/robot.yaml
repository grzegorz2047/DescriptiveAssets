asset: robot
brief: >
  A silver humanoid robot in a T-pose, built from the designer's front concept
  (refs/robot_front.png). 1.9 m tall, arm span about 2.23 m. Brushed steel plates over a black
  mechanical frame, blue lights (no emission: a bright blue) at the eyes, ears, chest, shoulders,
  arms, hips, thighs, knees and feet and down the spine. The back has its own plate over a black spine
  with blue lights. Detailed low-poly: the plates follow the divisions `sightline structure` finds in
  the concept; no rivets or panel lines; the T-pose keeps it ready for rigging.
style: default
tags: [character]
reference: {image: refs/robot_front.png, view: front, height: 1.9}
# Left/right follow the axes: _l parts are on -X (the viewer's left in the front view), which is the
# robot's right side. Every _l part is mirrored to _r. Arms run along X at shoulder height ~1.53 m.
# Plate positions come from `sightline structure assets/refs/robot_front.png --height 1.9`.
parts:
  # --- feet and lower legs ------------------------------------------------------------------------
  - name: sole_l                     # the dark 8 cm sole
    shape: box
    size: [0.17, 0.07, 0.3]
    round: 0.015
    material: paint_black
    at: [-0.175, 0, 0.04]
    align: bottom
    mirror: x
  - name: boot_l
    shape: box
    size: [0.15, 0.13, 0.27]
    round: 0.03
    material: metal
    at: [-0.175, 0.06, 0.045]
    align: bottom
    mirror: x
  - name: foot_band_l
    shape: box
    size: [0.04, 0.07, 0.03]
    round: 0.006
    material: iron
    at: [-0.167, 0.13, 0.185]
    mirror: x
  - name: foot_light_l
    shape: box
    size: [0.014, 0.045, 0.03]
    material: glow_blue
    at: [-0.167, 0.13, 0.2]
    mirror: x
  - name: ankle_l
    shape: cylinder
    radius: 0.042
    height: 0.09
    material: iron
    at: [-0.16, 0.12, -0.01]
    align: bottom
    mirror: x
  - name: calf_l                     # dark calf mechanics, seen beside the shin plate
    shape: cone
    radius: 0.045
    top_radius: 0.064
    height: 0.44
    sides: 8
    material: iron
    at: [-0.158, 0.14, -0.04]
    align: bottom
    mirror: x
  - name: shin_lower_l               # hexagonal frustum: narrow at the ankle, widest under the calf
    shape: cone
    radius: 0.04
    top_radius: 0.066
    height: 0.26
    sides: 6
    material: metal
    at: [-0.145, 0.21, 0.025]
    align: bottom
    mirror: x
  - name: shin_upper_l
    shape: cone
    radius: 0.066
    top_radius: 0.058
    height: 0.13
    sides: 6
    material: metal
    at: [-0.14, 0.47, 0.025]
    align: bottom
    mirror: x
  - name: knee_joint_l
    shape: box
    size: [0.1, 0.14, 0.11]
    round: 0.035
    material: iron
    at: [-0.135, 0.645, -0.01]
    mirror: x
  - name: knee_plate_l
    shape: box
    size: [0.08, 0.1, 0.05]
    round: 0.02
    material: metal
    at: [-0.13, 0.625, 0.055]
    mirror: x
  - name: knee_light_l
    shape: box
    size: [0.028, 0.01, 0.02]
    material: glow_blue
    at: [-0.13, 0.67, 0.083]
    mirror: x
  - name: thigh_core_l               # dark inner thigh, seen between the plates
    shape: capsule
    radius: 0.06
    height: 0.4
    material: iron
    at: [-0.105, 0.87, -0.02]
    mirror: x
  - name: thigh_plate_l              # 8-sided frustum: narrow at the knee, wide at the hip
    shape: cone
    radius: 0.075
    top_radius: 0.092
    height: 0.37
    sides: 8
    material: metal
    at: [-0.135, 0.67, 0.01]
    align: bottom
    mirror: x
  - name: thigh_light_l              # the light strip on the outer thigh
    shape: box
    size: [0.014, 0.04, 0.03]
    material: glow_blue
    at: [-0.216, 0.845, 0.0]
    mirror: x
  # --- pelvis --------------------------------------------------------------------------------------
  - name: pelvis
    shape: box
    size: [0.34, 0.15, 0.22]
    round: 0.03
    material: iron
    at: [0, 1.05, -0.02]
  - name: hip_belt_l                 # the V of the hip plate: a wing from the hip down to the middle
    shape: box
    size: [0.17, 0.06, 0.05]
