    height: 0.05
    rotate: [0, 0, 90]
    material: metal
    at: [-0.835, 1.532, 0]
    mirror: x
  - name: palm_l
    shape: box
    size: [0.13, 0.05, 0.1]
    round: 0.015
    material: metal
    at: [-0.915, 1.535, 0]
    mirror: x
  - name: thumb_l
    shape: box
    size: [0.085, 0.025, 0.025]
    round: 0.008
    rotate: [0, 0, 45]
    material: metal
    at: [-0.93, 1.49, 0.045]
    mirror: x
  - name: finger_a_l                 # fingers fan out, each a little lower than the last
    shape: box
    size: [0.09, 0.02, 0.018]
    round: 0.006
    rotate: [0, 0, 2]
    material: metal
    at: [-1.02, 1.538, -0.033]
    mirror: x
  - name: finger_b_l
    shape: box
    size: [0.1, 0.02, 0.018]
    round: 0.006
    rotate: [0, 0, 7]
    material: metal
    at: [-1.025, 1.53, -0.011]
    mirror: x
  - name: finger_c_l
    shape: box
    size: [0.12, 0.02, 0.018]
    round: 0.006
    rotate: [0, 0, 12]
    material: metal
    at: [-1.033, 1.521, 0.011]
    mirror: x
  - name: finger_d_l
    shape: box
    size: [0.11, 0.02, 0.018]
    round: 0.006
    rotate: [0, 0, 17]
    material: metal
    at: [-1.027, 1.512, 0.033]
    mirror: x
checks:
  - grounded
  - connected
  - stable
  - size: {height: [1.86, 1.94], width: [2.15, 2.3], why: "1.9 m tall, T-pose arm span about 2.23 m"}
  - symmetric: {axis: x, min: 0.95}
  - visible: {part: eye_l, view: front, min: 0.6, why: "the glowing eyes are the face"}
  - visible: {part: sternum_light, view: front, min: 0.6}
  - visible: {part: spine_light_1, view: back, min: 0.6, why: "the back has its own lights"}
  - relation: {a: cranium, is: above, b: chest_core}
  - relation: {a: back_plate, is: behind, b: chest_core}
  - contrast: {a: shoulder_ring_r, b: shoulder_disc_r, min: 2.0, why: "the blue rings read against the black joints"}
  - readable_at: {px: 48, min_iou: 0.7, keep: [cranium, chest_core, codpiece], view: front, why: "head, chest and the hip plate read on a small portrait"}
  - matches_reference: {min_iou: 0.83, max_missing: 0.08, why: "the designer's front concept"}
  - max_parts: 100
