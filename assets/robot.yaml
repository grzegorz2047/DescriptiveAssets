    at: [0, 1.47, -0.02]
  - name: pec_l
    shape: box
    size: [0.15, 0.2, 0.07]
    round: 0.03
    rotate: [0, -8, 0]
    material: metal
    at: [-0.11, 1.51, 0.1]
    mirror: x
  - name: rib_plate_l                # the lower chest plate under each pec
