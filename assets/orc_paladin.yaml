asset: orc_paladin
brief: >
  An armoured orc paladin in a T-pose, built from the designer's front concept
  (refs/orc_paladin_front.png). 2.1 m tall to the top of the head, arm span about 2.6 m.
  Silver steel plate with gold trim and sun emblems, a long red cape from the shoulders to
  mid-calf at the back, a cream tabard with a gold sun hanging from a leather belt, a pouch on
  one hip. Olive skin, tusks, pointed ears, black beard and two long braids. Game-ready low-
  poly: about 80-100 named parts, no engravings; the T-pose keeps it ready for rigging.
style: default
tags: [character, game_asset, rig_ready]
# Meters; +Y up, +X right, +Z = the front (the face looks at the front-view camera).
# _l parts are on -X = the viewer's left in the front view = the CHARACTER'S RIGHT side.
#
# Rig layout: every part is attached with `on:` to the body segment (bone) it rides on, so moving or
# rotating a segment carries its armour. Segment roots, top-down:
#   pelvis -> abdomen (spine) -> torso (chest) -> gorget -> neck -> head -> braid_root_* -> braid_*
#   torso  -> upper_arm_* -> forearm_* -> hand_* -> fingers_* (+ thumb_*)   (arms along -X / +X, y 1.66)
#   pelvis -> thigh_* -> shin_* (+ knee_*) -> foot_* -> toe_*, sole_*        (legs straight, x = +-0.245)
#   pelvis -> tasset_* -> tasset_lower_*;  belt -> tabard, pouch;  torso -> pauldron_*, cape
#   pauldron_* -> pauldron_rim_*;  pauldron_lower_* -> pauldron_lower_rim_*  (gold edges follow their plate)
# The cape is one cloth mesh (cape) with two gold trim meshes (cape_hem, cape_border); the hidden
# pelvis and neck parts are kept as filler meshes for their bones (no gaps when the rig bends).
# The arm parts are rotated 90 deg about z, so in their own frame +Y points out along the arm
# (toward the fingertips): offsets on arm children read [up, out, front].
# Built from candidate C with grafts: the 4-bar chest sun and the 64 px head check (from A), the
# sloped cape top, the tabard laurels and the mid-calf / T-pose / tusk checks (from B). Budget: 100
# solid parts (the cuts are free); the pouch clasp was dropped to pay for the laurels.
# Exported glb (default quality): 97 nodes (blend groups merge 3 pairs), about 11.1k triangles;
# only the cape keeps 4 non-manifold edges where its side and front cuts meet.
parts:
  # --- pelvis, spine, chest ------------------------------------------------------------------------
  - name: pelvis                     # root bone: hips under the faulds, belt and tabard
    shape: box
    size: [0.44, 0.30, 0.30]
    round: 0.05
    material: metal
    at: [0, 1.13, 0]
  - name: abdomen                    # spine: plated faulds between the breastplate and the belt
    shape: box
    size: [0.48, 0.16, 0.31]
    round: 0.04
    material: metal
    on: pelvis.center
    align: center
    offset: [0, 0.25, 0]
  - name: torso                      # chest: breastplate and plain back plate (under the cape), well rounded
    shape: box
    size: [0.54, 0.42, 0.34]
    round: 0.10
    material: metal
    on: abdomen.center
    align: center
    offset: [0, 0.25, 0]
  - name: belt                       # wide leather belt, y 1.27..1.36
    shape: box
    size: [0.53, 0.09, 0.35]
    round: 0.03
    material: leather
    on: pelvis.center
    align: center
    offset: [0, 0.185, 0]
  - name: buckle                     # round gold sun buckle (octagon, 3 cm proud)
    shape: cylinder
    radius: 0.07
    height: 0.045
    sides: 8
    material: gold
    on: belt.center
    align: center
    offset: [0, 0, 0.185]
    rotate: [90, 0, 22.5]
  - name: pouch                      # leather pouch on the viewer's left hip (the only asymmetric part)
    shape: box
    size: [0.12, 0.15, 0.07]
    round: 0.015
