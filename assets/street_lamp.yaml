asset: street_lamp
brief: >
  A cast-iron street lamp for a cobbled square, about 3.3 m: a stepped foot, a slim post with a
  collar, and a square lantern with warm glowing glass under a pointed cap. The glass must face
  the player, and the lamp must read as one slim vertical line from a distance.
style: default
tags: [prop, light, level_object]
parts:
  - name: foot                       # stepped octagonal foot
    shape: cylinder
    radius: 0.22
    height: 0.14
    sides: 8
    material: iron
    align: bottom
  - name: foot_step
    shape: cone
    radius: 0.16
    top_radius: 0.08
    height: 0.3
    sides: 8
    material: iron
    on: foot.top
  - name: post
    shape: cylinder
    radius: 0.06
    height: 2.3
    material: iron
    on: foot_step.top
    offset: [0, -0.05, 0]
  - name: collar                     # decorative ring a third of the way up
    shape: torus
    radius: 0.07
    thickness: 0.03
    material: gold
    on: post@[0, -0.2, 0]
    align: center
  - name: lantern_base               # square tray under the glass (4 sides = flat faces to the axes)
    shape: cone
    radius: 0.1
    top_radius: 0.2
    height: 0.1
    sides: 4
    material: iron
    on: post.top
  - name: glass
    shape: box
    size: [0.26, 0.34, 0.26]
    material: lamp
    on: lantern_base.top
    tags: [light]
  - name: bar                        # corner bars around the glass -> bar_0 .. bar_3
    shape: box
    size: [0.025, 0.34, 0.025]
    material: iron
    on: glass.bottom_front_right
    align: bottom
    repeat: {count: 4, axis: y}
  - name: cap                        # pointed cap overhanging the glass
    shape: cone
    radius: 0.27
    height: 0.24
    sides: 4
    material: iron
    on: glass.top
  - name: finial
    shape: sphere
    radius: 0.035
    material: gold
    on: cap.top
    align: center
checks:
  - grounded
  - connected
  - stable
  - size: {height: [3.1, 3.5], width: [0.35, 0.5], why: "a slim lamp, about 3.3 m"}
  - visible: {part: glass, view: front, min: 0.45, why: "the glass must face the player (corner bars cover the rest)"}
  - contrast: {a: glass, b: cap, min: 2.0, why: "the light must pop against the iron"}
  - relation: {a: cap, is: above, b: glass}
  - symmetric: {axis: x, min: 0.95}
  - readable_at: {px: 48, min_iou: 0.7, keep: [glass, post], why: "one slim vertical line from a distance"}
  - max_parts: 16
